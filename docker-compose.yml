version: '3.8'

services:
  # Main API application - IN-MEMORY ONLY
  pneumonia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumonia-detection-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "3.4.2"
      DEBUG: "false"
      # FORCE IN-MEMORY STORAGE
      STORAGE_BACKEND: "memory"
      # REMOVE REDIS_URL to prevent Redis connection attempts
      # REDIS_URL: ""  # Commented out completely
      
      # PRODUCTION CONFIGURATION - FREE TIER OPTIMIZED
      ADVANCED_RATE_LIMITING_ENABLED: "true"
      MAX_REQUESTS_PER_IP: "100"
      MAX_FINGERPRINT_REQUESTS: "50"
      RATE_LIMIT_WINDOW_SIZE: "300"
      IP_SWITCHING_THRESHOLD: "5"
      SUSPICIOUS_IP_CHANGES_THRESHOLD: "10"
      GLOBAL_ATTACK_THRESHOLD: "0.7"
      BOT_BEHAVIOR_VARIANCE: "0.1"
      ATTACK_BLOCK_DURATION: "300"
      FINGERPRINT_BLOCK_DURATION: "600"
      IP_SWITCHING_DETECTION_WINDOW: "300"
      BEHAVIORAL_ANALYSIS_WINDOW: "600"
      GLOBAL_ATTACK_SCORE_WINDOW: "900"
      COORDINATED_ATTACK_THRESHOLD: "3"
      BOT_TIMING_THRESHOLD: "2.0"
      MAX_RECENT_IPS: "1000"
      MAX_REQUEST_PATTERNS_PER_IP: "50"
      MAX_FILE_HASH_REQUESTS: "500"
      MAX_GLOBAL_REQUEST_RATE: "500"
      MAX_FINGERPRINTS_PER_IP: "10"
      ATTACK_REDUCTION_FACTOR: "0.5"
      PREDICTION_CONCURRENCY_LIMIT: "3"
      PREDICTION_MAX_REQUESTS_PER_IP: "18"
      PREDICTION_RATE_WINDOW: "300"
      
      
      # IN-MEMORY STORAGE CONFIGURATION - FREE TIER OPTIMIZED
      MEMORY_MAX_SIZE: "1000"
      MEMORY_CLEANUP_INTERVAL: "180"
      MEMORY_DEFAULT_TTL: "1800"
      
      # List fields as comma-separated strings
      TRUSTED_HOSTS: "localhost,127.0.0.1,0.0.0.0,*.railway.app"
      CORS_ORIGINS: "*"
      EXCLUDED_PATHS: "/health,/,/docs,/redoc,/openapi.json"
      ALLOWED_EXTENSIONS: ".jpg,.jpeg,.png"
    # REMOVE DEPENDENCY ON REDIS
    # depends_on:
    #   redis:
    #     condition: service_healthy
    networks:
      - pneumonia-network
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"      # 1 vCPU
          memory: 512M     # Railway free tier memory

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: pneumonia-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pneumonia-api
    networks:
      - pneumonia-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

# FIXED: Remove volumes section completely since we don't need any named volumes
# volumes:
#   redis_data:
#     driver: local

networks:
  pneumonia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16