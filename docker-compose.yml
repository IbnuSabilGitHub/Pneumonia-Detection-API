version: '3.8'

services:
  # Redis for advanced rate limiting
  redis:
    image: redis:7-alpine
    container_name: pneumonia-api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pneumonia_redis_dev}
    command: redis-server --requirepass ${REDIS_PASSWORD:-pneumonia_redis_dev}
    volumes:
      - redis_data:/data
    networks:
      - pneumonia-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"      # ~0.5 vCPU
          memory: 128M     # Redis tidak perlu besar

  # Main API application
  pneumonia-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumonia-detection-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "3.4.2"
      DEBUG: "false"
      STORAGE_BACKEND: "redis"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-pneumonia_redis_dev}@redis:6379/0"
      ADVANCED_RATE_LIMITING_ENABLED: "true"
      MAX_REQUESTS_PER_IP: "10"
      MAX_FINGERPRINT_REQUESTS: "3"
      TRUSTED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      CORS_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pneumonia-network
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"      # 1 vCPU
          memory: 512M     # Railway free tier memory

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: pneumonia-api-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pneumonia-api
    networks:
      - pneumonia-network
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

volumes:
  redis_data:
    driver: local

networks:
  pneumonia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
