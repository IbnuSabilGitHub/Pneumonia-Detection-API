# FastAPI CLI configuration
# This file tells FastAPI CLI how to run the application

[tool.fastapi-cli]
app = "main:app"
host = "127.0.0.1"
port = 8000
reload = true

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88
