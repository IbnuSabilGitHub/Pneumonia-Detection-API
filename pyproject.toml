# FastAPI CLI configuration
# This file tells FastAPI CLI how to run the application

[project]
name = "pneumonia-detection-api"
version = "3.4.2"
description = "AI-powered pneumonia detection API from chest X-ray images"

[tool.fastapi-cli]
app = "main:app"
host = "127.0.0.1"
port = 8000
reload = true

[tool.black]
line-length = 88
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
]
